<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Writing Lab · Phase 1</title>
<style>
:root{--bg:#f5f6f3;--panel:#fff;--ink:#19261e;--muted:#65736a;--line:#e0e6e0;--accent:#275c47;--soft:#e8f1eb;--warn:#fff3df;--bad:#fbeaea;--good:#e5f3e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:9px 13px}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}textarea,input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfcfa;color:var(--ink)}textarea{min-height:95px;resize:vertical} .app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:12px}.logo{font-size:19px;font-weight:800;letter-spacing:-.3px}.logo small{display:block;color:var(--muted);font-size:12px;font-weight:500}.nav{display:grid;gap:4px}.nav button{text-align:left;border:0;background:transparent;color:var(--muted)}.nav button.active{background:var(--soft);color:var(--accent);font-weight:700}.sidefoot{margin-top:auto;color:var(--muted);font-size:12px}.main{padding:clamp(16px,4vw,40px);max-width:1100px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.h1{font-size:clamp(25px,4vw,34px);font-weight:800;letter-spacing:-.04em;margin:4px 0}.sub{color:var(--muted);max-width:680px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{border:1px solid var(--line);border-radius:12px;padding:14px}.stat strong{font-size:23px;display:block}.label{color:var(--muted);font-size:13px}.sectiontitle{font-size:18px;font-weight:750;margin:0 0 10px}.step{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0}.step span{padding:4px 9px;border-radius:8px;background:var(--soft);font-size:12px;color:var(--accent)}.field{margin:12px 0}.field label{display:block;font-weight:650;margin-bottom:6px}.hint{color:var(--muted);font-size:13px}.feedback{padding:12px;border-radius:10px;margin:12px 0;background:var(--soft)}.feedback.bad{background:var(--bad)}.feedback.good{background:var(--good)}.phrase{font-size:23px;font-weight:750;margin:10px 0}.answer{display:none;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.answer.show{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.list{display:grid;gap:10px}.item{padding:13px;border:1px solid var(--line);border-radius:12px}.item h3{margin:0 0 4px;font-size:16px}.smallbtn{padding:5px 9px;font-size:13px}.progress{height:7px;border-radius:10px;background:#e7ebe7;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--accent);width:0}.empty{padding:24px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e2a22;color:white;padding:10px 16px;border-radius:10px;display:none;z-index:9}.toast.show{display:block}.navtoggle{display:none}.footerline{font-size:12px;color:var(--muted);margin-top:16px}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;padding:12px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:8px 4px;font-size:13px}.sidefoot{display:none}.grid{grid-template-columns:1fr}.main{padding:16px}}
</style></head><body>
<div class="app"><aside class="side"><div class="logo">IELTS Writing Lab<small>Phase 1 · Core training loop</small></div><nav class="nav" id="nav">
<button data-view="home" class="active">⌂ Today / 首页</button><button data-view="ideas">◎ Idea generation</button><button data-view="recall">↻ Phrase recall</button><button data-view="argument">⇢ Argument builder</button><button data-view="sentence">✎ Sentence practice</button><button data-view="errors">⚑ Error log</button></nav><div class="sidefoot">学习记录仅保存在此浏览器<br>Local storage · 可导出备份</div></aside><main class="main" id="main"></main></div><div class="toast" id="toast"></div>
<script>
const KEY='ielts_lab_phase1_v1';
const seedIdeas=[
{id:'idea1',cn:'提高教育公平性',en:'Improve educational equality',ex:'Public investment can improve educational equality by giving disadvantaged students access to quality learning.',topic:['Education','Government','Society'],chain:['Public investment in schools','Provide resources to underserved areas','Narrow the educational gap','Improve social mobility']},
{id:'idea2',cn:'培养独立思考能力',en:'Develop independent thinking',ex:'Open discussions encourage students to evaluate evidence rather than accept information passively.',topic:['Education','Technology','Society'],chain:['Encourage discussion and inquiry','Expose learners to different perspectives','Develop independent thinking','Make better-informed decisions']},
{id:'idea3',cn:'提高工作效率',en:'Improve workplace efficiency',ex:'Automation allows employees to complete routine tasks more quickly and focus on complex work.',topic:['Technology','Work','Economy'],chain:['Adopt digital tools','Automate routine tasks','Improve workplace efficiency','Increase productivity']},
{id:'idea4',cn:'减轻经济压力',en:'Reduce financial pressure',ex:'Affordable public services can reduce financial pressure on low-income households.',topic:['Government','Society','Economy'],chain:['Provide affordable public services','Lower essential living costs','Reduce financial pressure','Improve quality of life']},
{id:'idea5',cn:'促进身心健康',en:'Promote physical and mental well-being',ex:'Regular outdoor activities can help people stay physically active and relieve stress.',topic:['Health','Education','Society'],chain:['Encourage regular exercise','Improve physical condition and relieve stress','Promote well-being','Build healthier communities']},
{id:'idea6',cn:'保护环境并减少污染',en:'Protect the environment and reduce pollution',ex:'Stricter environmental regulations can encourage businesses to adopt cleaner production methods.',topic:['Environment','Government','Economy'],chain:['Introduce environmental regulations','Encourage cleaner production','Reduce pollution','Protect public health and ecosystems']},
{id:'idea7',cn:'创造更多就业机会',en:'Create more employment opportunities',ex:'Investment in emerging industries can create jobs and provide workers with new career paths.',topic:['Work','Economy','Technology'],chain:['Invest in growing industries','Expand business activity','Create employment opportunities','Support economic growth']},
{id:'idea8',cn:'缩小社会不平等',en:'Reduce social inequality',ex:'Targeted welfare programmes can help vulnerable groups access essential resources.',topic:['Society','Government','Education'],chain:['Support disadvantaged groups','Improve access to essential services','Reduce social inequality','Create a more inclusive society']},
{id:'idea9',cn:'增强文化理解',en:'Promote cultural understanding',ex:'International exchanges expose people to different customs and values, promoting mutual understanding.',topic:['Culture','International','Education'],chain:['Increase cross-cultural contact','Learn about different values','Promote cultural understanding','Reduce prejudice']},
{id:'idea10',cn:'培养实践技能',en:'Develop practical skills',ex:'Work placements allow students to apply classroom knowledge to real situations and develop practical skills.',topic:['Education','Work'],chain:['Provide hands-on experience','Apply theoretical knowledge','Develop practical skills','Improve employability']},
{id:'idea11',cn:'提升公共安全',en:'Improve public safety',ex:'Well-designed public spaces and effective enforcement can make communities safer.',topic:['Government','Society','Crime'],chain:['Improve public facilities and enforcement','Prevent risky situations','Improve public safety','Strengthen community confidence']},
{id:'idea12',cn:'节省时间并提高便利性',en:'Save time and increase convenience',ex:'Online services allow people to complete everyday tasks without travelling or waiting in long queues.',topic:['Technology','Society','Work'],chain:['Move services online','Reduce travel and waiting time','Save time and increase convenience','Make daily life more efficient']}
];
const defaultState={learned:{},errors:[],lastView:'home',drafts:{idea:'',argument:[],sentence:''},stats:{ideaAttempts:0,recallAttempts:0,argumentAttempts:0,sentenceAttempts:0,transferAttempts:0},customIdeas:[],phraseStats:{},lastActive:Date.now()};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return {...defaultState,...s,stats:{...defaultState.stats,...s.stats},drafts:{...defaultState.drafts,...s.drafts}}}catch(e){return {...defaultState}}}
let state=load(),view='home',ideaIndex=0,recallIndex=null,recallRevealed=false,argStep=0,sentenceLevel=1,transferQuestion=0;
const prompts=[
{q:'Some people think that technology has made people less sociable. To what extent do you agree or disagree?',focus:'technology and social relationships',hint:['Who is affected—individuals, families or communities?','Does technology replace face-to-face contact, or also help maintain distant relationships?','Think about communication frequency, quality and convenience.'],choices:['It can weaken face-to-face relationships','It can help people stay connected over distance']},
{q:'Some people believe schools should teach practical skills rather than academic subjects. Discuss both views and give your own opinion.',focus:'education and practical skills',hint:['What do students need immediately after graduation?','What does academic knowledge help them do in the long run?','Can schools balance both rather than choose one?'],choices:['Practical skills improve work readiness','Academic subjects build foundational knowledge']},
{q:'Many people prefer shopping online. Is this a positive or negative development?',focus:'online shopping',hint:['Who benefits from convenience?','What might happen to local shops or impulse spending?','Consider time, choice, competition and employment.'],choices:['Convenience saves time for consumers','Small local businesses may face pressure']}
];
function save(){state.lastActive=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('保存失败：浏览器存储可能已满');return false}}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dueIdeas(){return seedIdeas.filter(x=>{let p=state.phraseStats[x.id];return !p||!p.due||p.due<=Date.now()})}
function phraseState(id){return state.phraseStats[id]||{reviews:0,correct:0,wrong:0,stage:0,due:0}}
function updatePhrase(id,known){let p=phraseState(id);p.reviews++;p.stage=known?Math.min(5,p.stage+1):Math.max(0,p.stage-1);p.correct+=known?1:0;p.wrong+=known?0:1;p.last=Date.now();let delays=[0,1,3,7,14,30];p.due=Date.now()+delays[p.stage]*86400000;state.phraseStats[id]=p;state.stats.recallAttempts++;if(!known){state.errors.unshift({kind:'Memory',detail:'Phrase recall missed: '+(seedIdeas.find(x=>x.id===id)?.en||id),time:Date.now(),repair:'Review meaning, then try recalling the phrase again.'})}save()}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const m=document.getElementById('main');m.innerHTML=view==='home'?home():view==='ideas'?ideas():view==='recall'?recall():view==='argument'?argument():view==='sentence'?sentence():errors();state.lastView=view;save()}
function go(v){view=v;render()}
function home(){let due=dueIdeas().length,rec=state.stats.recallAttempts,ideasN=state.stats.ideaAttempts,ar=state.stats.argumentAttempts,sen=state.stats.sentenceAttempts;
return '<div class="top"><div><div class="eyebrow">Your learning path</div><h1 class="h1">Today, one step at a time.</h1><div class="sub">不要急着写完整作文。先训练你能独立生成观点、回忆表达并解释逻辑的能力。</div></div></div><div class="panel"><div class="sectiontitle">Today’s focus / 今日训练</div><div class="step"><span>Recall</span><span>Idea</span><span>Argument</span><span>Sentence</span></div><div class="grid"><div class="stat"><strong>'+due+'</strong><div class="label">到期表达待复习</div></div><div class="stat"><strong>'+ideasN+'</strong><div class="label">观点生成尝试</div></div><div class="stat"><strong>'+ar+'</strong><div class="label">论证链尝试</div></div><div class="stat"><strong>'+sen+'</strong><div class="label">句子练习尝试</div></div></div><div class="actions"><button class="primary" onclick="go(\'recall\')">Continue Learning / 继续学习</button><button onclick="go(\'ideas\')">开始观点生成</button></div></div><div class="panel"><div class="sectiontitle">能力成长（基于真实记录）</div>'+skillbar('主动回忆',rec,20)+skillbar('观点生成',ideasN,20)+skillbar('逻辑构建',ar,20)+skillbar('英语表达',sen,20)+'<p class="hint">进度条仅反映实际训练次数，不代表雅思分数或已掌握程度。</p></div><div class="panel"><div class="sectiontitle">训练建议</div><p>如果你今天不知道写什么，先进入观点生成。系统不会一开始展示完整答案，会逐层提供提示。</p><div class="actions"><button onclick="go(\'ideas\')">Generate Ideas</button><button onclick="go(\'argument\')">Build an Argument</button><button onclick="go(\'sentence\')">Build a Sentence</button><button onclick="go(\'errors\')">查看错误记录</button></div></div>'}
function skillbar(label,n,max){let p=Math.min(100,Math.round(n/max*100));return '<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><b>'+label+'</b><span class="hint">'+n+' 次训练</span></div><div class="progress"><i style="width:'+p+'%"></i></div></div>'}
function ideas(){let q=prompts[ideaIndex%prompts.length];let d=state.drafts.idea||'';return '<div class="top"><div><div class="eyebrow">Module 2 · Idea generation</div><h1 class="h1">先想观点，再看素材</h1><div class="sub">训练目标：从题目中找到可讨论的对象和影响维度。请先用中文尝试，卡住时再逐层打开提示。</div></div></div><div class="panel"><div class="eyebrow">Practice question '+(ideaIndex+1)+' / '+prompts.length+'</div><h2>'+q.q+'</h2><p class="hint">Focus: '+q.focus+'</p><div class="field"><label>你的中文观点（至少写一个方向）</label><textarea id="ideaInput" placeholder="我认为……因为……这会导致……">'+esc(d)+'</textarea></div><div class="actions"><button onclick="showHint(0)">提示 1</button><button onclick="showHint(1)">提示 2</button><button onclick="showHint(2)">提示 3</button><button onclick="showChoices()">思考方向</button><button class="primary" onclick="submitIdea()">提交并反馈</button></div><div id="hintbox"></div><div id="ideaFeedback"></div></div><div class="panel"><div class="sectiontitle">思考维度（可点击，作为卡住时的思路入口）</div><div class="actions">'+['Individual','Family','Education','Economy','Society','Government','Environment','Health','Culture','Technology','Employment','Equality'].map(x=>'<button class="smallbtn" onclick="insertDimension(\''+x+'\')">'+x+'</button>').join('')+'</div></div><div class="panel"><div class="sectiontitle">可迁移观点素材（尝试后再展开）</div><button onclick="toggleIdeaBank()">展开素材库 / Viewpoint Bank</button><div id="ideaBank" class="answer">'+seedIdeas.map(x=>'<div class="item"><h3>'+x.cn+' · '+x.en+'</h3><p class="hint">适用：'+x.topic.join(' / ')+'</p><p>'+x.ex+'</p></div>').join('')+'</div></div><div class="actions"><button onclick="prevIdea()">上一题</button><button class="primary" onclick="nextIdea()">下一题</button></div>'}
function showHint(n){document.getElementById('hintbox').innerHTML='<div class="feedback">提示 '+(n+1)+'：'+prompts[ideaIndex%prompts.length].hint[n]+'</div>'}
function showChoices(){let q=prompts[ideaIndex%prompts.length];document.getElementById('hintbox').innerHTML='<div class="feedback">可考虑方向：<ul>'+q.choices.map(x=>'<li>'+x+'</li>').join('')+'</ul>先想想它们各自的原因和可能结果。</div>'}
function insertDimension(x){let t=document.getElementById('ideaInput');t.value=(t.value?t.value+'；':'')+'从'+x+'角度：';t.focus();state.drafts.idea=t.value;save()}
function submitIdea(){let v=document.getElementById('ideaInput').value.trim();if(v.length<8){document.getElementById('ideaFeedback').innerHTML='<div class="feedback bad">再具体一点：写出观点，并尽量补充“为什么”或“会产生什么影响”。</div>';return}state.drafts.idea=v;state.stats.ideaAttempts++;save();document.getElementById('ideaFeedback').innerHTML='<div class="feedback good"><b>完成一次独立思考。</b><p>你的观点已保存。下一步检查：① 是否直接回应题目？② 是否有因果解释？③ 是否能进一步展开？</p><p class="hint">你可以先自己检查，也可继续下一题。</p></div>';toast('观点已保存')}
function nextIdea(){ideaIndex=(ideaIndex+1)%prompts.length;state.drafts.idea='';save();render()}function prevIdea(){ideaIndex=(ideaIndex+prompts.length-1)%prompts.length;render()}function toggleIdeaBank(){document.getElementById('ideaBank').classList.toggle('show')}
function recall(){let due=dueIdeas();let x=due[0]||seedIdeas[0];recallIndex=x.id;recallRevealed=false;return '<div class="top"><div><div class="eyebrow">Module 3 · Memory training</div><h1 class="h1">主动回忆，不是看懂就算</h1><div class="sub">先看中文，尝试在脑中或输入框里回忆英文。答案可以接受合理同义表达。</div></div></div><div class="panel"><div class="eyebrow">Review queue · '+due.length+' 项到期</div><div class="phrase">'+x.cn+'</div><div class="field"><label>尝试回忆英文表达（可选输入）</label><input id="recallInput" placeholder="Type the phrase you can remember..." autocomplete="off"></div><div class="actions"><button class="primary" onclick="revealRecall()">显示参考表达</button><button onclick="recallHint()">给我提示</button></div><div id="recallHintBox"></div><div class="answer" id="recallAnswer"><h3>'+x.en+'</h3><p>'+x.ex+'</p><div class="actions"><button onclick="rateRecall(false)">× 没想起来 / 错了</button><button class="primary" onclick="rateRecall(true)">✓ 记得 / 正确</button></div></div></div><div class="panel"><div class="sectiontitle">记忆机制</div><p>复习间隔随答题表现变化：1 → 3 → 7 → 14 → 30 天。答错会降低阶段并重新安排更短间隔。未到期表达不会强制出现。</p><div class="hint">熟悉 → 理解 → 主动回忆 → 句子应用 → 迁移</div></div>'}
function revealRecall(){recallRevealed=true;document.getElementById('recallAnswer').classList.add('show');document.getElementById('recallHintBox').innerHTML='';}
function recallHint(){let x=seedIdeas.find(a=>a.id===recallIndex);document.getElementById('recallHintBox').innerHTML='<div class="feedback">关键词提示：'+x.en.split(' ').map(w=>w[0]+'…').join(' ')+'</div>'}
function rateRecall(k){if(!recallIndex)return;updatePhrase(recallIndex,k);toast(k?'已记录为正确':'已记录为需要强化');render()}
function argument(){let chain=['观点','原因','作用机制','结果','深层影响'];let curr=state.drafts.argument||[];let focus=seedIdeas[3];let fields=chain.map((c,i)=>'<div class="field"><label>'+i+'. '+c+'</label><textarea id="arg'+i+'" placeholder="'+(i===0?'例如：Reduce financial pressure':i===1?'Why?':i===2?'How does this work?':'What follows?')+'">'+esc(curr[i]||'')+'</textarea></div>').join('');return '<div class="top"><div><div class="eyebrow">Module 5 · Argument builder</div><h1 class="h1">把观点变成逻辑链</h1><div class="sub">每次只完成一个环节。不要追求复杂，先确保因果关系成立。</div></div></div><div class="panel"><div class="sectiontitle">练习主题</div><p><b>Government support for low-income families</b></p><div class="step"><span>观点</span><span>原因</span><span>机制</span><span>结果</span><span>影响</span></div>'+fields+'<div class="actions"><button class="primary" onclick="checkArgument()">检查逻辑链</button><button onclick="clearArgument()">清空草稿</button></div><div id="argFeedback"></div></div><div class="panel"><div class="sectiontitle">示例逻辑链（提交后才建议查看）</div><button onclick="document.getElementById(\'argExample\').classList.toggle(\'show\')">显示参考示例</button><div class="answer" id="argExample"><ol>'+focus.chain.map(x=>'<li>'+x+'</li>').join('')+'</ol><p class="hint">注意：这是一个可能的逻辑，不是唯一答案。你可以用其他合理因果链。</p></div></div>'}
function checkArgument(){let a=[0,1,2,3,4].map(i=>document.getElementById('arg'+i).value.trim());if(a.some(x=>x.length<5)){document.getElementById('argFeedback').innerHTML='<div class="feedback bad">至少补全每个环节，写短句即可。每一步需要有具体内容。</div>';return}state.drafts.argument=a;state.stats.argumentAttempts++;let flags=a.map(x=>x.toLowerCase());let dup=flags.some((x,i)=>flags.slice(i+1).some(y=>x===y));save();document.getElementById('argFeedback').innerHTML='<div class="feedback good"><b>已记录并完成逻辑链检查。</b><p>自检重点：每一步是否回答上一步？原因有没有解释“为什么”？机制有没有解释“如何发生”？结果与深层影响是否区分开？</p>'+(dup?'<p class="hint">提醒：检测到内容重复，建议改写其中一个环节。</p>':'')+'</div>';toast('论证练习已保存')}
function clearArgument(){state.drafts.argument=[];save();render()}
function sentence(){let prompt='Government support can reduce financial pressure on low-income families.';return '<div class="top"><div><div class="eyebrow">Module 6 · Sentence builder</div><h1 class="h1">从中文意思到英文句子</h1><div class="sub">本次只训练一个重点：原因从句（because）→ 方式表达（by + -ing）。先写，再升级。</div></div></div><div class="panel"><div class="sectiontitle">Base idea / 基础表达</div><p><b>'+prompt+'</b></p><div class="field"><label>LEVEL 1 · 用 because 写一个原因句</label><textarea id="sentenceInput" placeholder="Government support can ... because ...">'+esc(state.drafts.sentence||'')+'</textarea></div><div class="actions"><button class="primary" onclick="checkSentence()">提交句子</button><button onclick="showSentenceUpgrade()">查看升级方法</button></div><div id="sentenceFeedback"></div><div class="answer" id="sentenceUpgrade"><p><b>LEVEL 2:</b> Government support can reduce financial pressure because it lowers essential living costs.</p><p><b>LEVEL 3:</b> By covering part of their essential expenses, government support enables low-income families to spend more on education and healthcare.</p><p class="hint">升级不是堆砌复杂词，而是让机制更具体。</p></div></div><div class="panel"><div class="sectiontitle">错误重点</div><p>一次只处理一个重点。如果本句出现其他错误，会先保留并在后续训练逐步修正。</p></div>'}
function checkSentence(){let v=document.getElementById('sentenceInput').value.trim();if(v.length<12){document.getElementById('sentenceFeedback').innerHTML='<div class="feedback bad">先写出一个完整句子，至少包含主语和谓语。</div>';return}state.drafts.sentence=v;state.stats.sentenceAttempts++;let hasBecause=/\bbecause\b/i.test(v);save();document.getElementById('sentenceFeedback').innerHTML='<div class="feedback '+(hasBecause?'good':'')+'"><b>已保存你的句子。</b><p>'+(hasBecause?'你使用了 because 原因结构。下一步检查原因是否具体、与主句是否直接相关。':'本次目标是 because 原因结构。你可以尝试用 because 解释主句成立的原因。')+'</p><p class="hint">下一轮训练会重点关注因果连接是否清晰，不会一次纠正所有问题。</p></div>';toast('句子练习已保存')}
function showSentenceUpgrade(){document.getElementById('sentenceUpgrade').classList.toggle('show')}
function errors(){let e=state.errors||[];return '<div class="top"><div><div class="eyebrow">Module 9 · Error diagnosis</div><h1 class="h1">错误不是终点，是下一轮训练入口</h1><div class="sub">系统记录你训练中明确出现的错误或未回忆项目。这里不会生成虚假的历史记录。</div></div></div><div class="panel"><div class="sectiontitle">Error log · '+e.length+' 条记录</div>'+(e.length?'<div class="list">'+e.map(x=>'<div class="item"><h3>'+esc(x.kind)+'</h3><p>'+esc(x.detail)+'</p><div class="hint">'+new Date(x.time).toLocaleString()+'</div><p class="hint">修复建议：'+esc(x.repair||'再次练习该知识点。')+'</p></div>').join('')+'</div>':'<div class="empty">目前没有错误记录。主动回忆中标记“没想起来”后，错误会出现在这里。</div>')+'<div class="actions"><button onclick="exportData()">导出备份 JSON</button><button onclick="importData()">导入备份</button><button onclick="resetData()">重置本地学习数据</button></div><input type="file" id="importFile" accept=".json" hidden></div>'}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ielts-writing-lab-backup.json';a.click();URL.revokeObjectURL(a.href);toast('备份文件已生成')}
function importData(){document.getElementById('importFile').click()}
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d.stats||!d.phraseStats)throw Error();state={...defaultState,...d,stats:{...defaultState.stats,...d.stats}};save();render();toast('备份导入成功')}catch(err){toast('导入失败：文件格式不正确')}};reader.readAsText(e.target.files[0])}});
function resetData(){if(confirm('确定重置所有本地学习记录？此操作无法撤销。')){localStorage.removeItem(KEY);state=load();render();toast('本地数据已重置')}}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-view]');if(b)go(b.dataset.view)});
render();
</script></body></html>
