<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Question · IELTS Paragraph Lab</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#18233a;--line:#293750;--text:#e8edf7;--muted:#9aa9c1;--teal:#66e0c2;--amber:#ffc979;--red:#ff8d99;--blue:#8db9ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#0b1020,#0d1426 55%,#101b2d);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-weight:800;letter-spacing:.3px}.brand span{color:var(--teal)}.small{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px}.side,.main{background:rgba(18,26,45,.88);border:1px solid var(--line);border-radius:18px}.side{padding:16px;height:max-content;position:sticky;top:15px}.main{padding:24px;min-height:620px}.nav button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;color:var(--muted);border:1px solid transparent;padding:10px;border-radius:10px}.nav button.active{background:var(--panel2);color:var(--text);border-color:var(--line)}.progress{height:5px;background:#27334a;border-radius:20px;margin:15px 0;overflow:hidden}.progress i{display:block;height:100%;background:var(--teal);width:0;transition:.3s}
h1{font-size:26px;margin:0 0 8px}h2{font-size:19px;margin:24px 0 10px}h3{font-size:15px;margin:10px 0}p{margin:8px 0}.muted{color:var(--muted)}.eyebrow{color:var(--teal);font-size:12px;font-weight:700;letter-spacing:1.1px}.card{border:1px solid var(--line);background:#111a2c;border-radius:14px;padding:15px;margin:12px 0}.question{font-size:18px;line-height:1.6}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}textarea,input,select{width:100%;border:1px solid #34445f;border-radius:10px;background:#0c1425;color:var(--text);padding:11px;font:inherit;outline:none}textarea{min-height:84px;resize:vertical}textarea:focus,input:focus,select:focus{border-color:var(--teal)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--line);background:#1b2941;color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:650}.btn:hover{border-color:var(--teal)}.primary{background:var(--teal);color:#08201c;border-color:var(--teal)}.ghost{background:transparent}.pill{display:inline-block;padding:4px 9px;border-radius:30px;border:1px solid var(--line);color:var(--muted);font-size:12px;margin-right:4px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;background:#111a2b;border:1px solid var(--line);border-radius:12px}.stat strong{display:block;font-size:24px;color:var(--teal)}.phrase{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.phrase strong{color:#c5e9ff}.phrase .tags{font-size:12px;color:var(--muted)}.divider{border-top:1px solid var(--line);margin:18px 0}.notice{padding:12px;border-radius:10px;background:#17283a;color:#b9d6ed;font-size:13px}.node{display:inline-block;border:1px solid #42536d;border-radius:11px;padding:9px 12px;margin:5px;background:#17243a}.edge{color:var(--teal);font-size:12px;margin:3px}.hidden{display:none}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.danger{color:var(--red)}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static}.main{padding:17px}.grid2,.statgrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div><div class="brand">IELTS <span>PARAGRAPH LAB</span></div><div class="small">Real question → your thinking → language gaps → personal knowledge graph</div></div><div class="small" id="savedStatus">本地保存 · 当前浏览器</div></header>
<div class="layout"><aside class="side"><div class="eyebrow">TRAINING FLOW</div><div class="progress"><i id="progressBar"></i></div><div class="nav" id="nav"></div><div class="divider"></div><div class="small">你的训练数据保存在本浏览器。建议定期导出备份。</div><div class="btns"><button class="btn ghost" id="exportBtn">导出备份</button><button class="btn ghost" id="importBtn">导入备份</button><input type="file" id="importFile" accept=".json" hidden></div></aside>
<main class="main"><div id="content"></div></main></div></div>
<script>
const STORE='ielts-paragraph-lab-v1';
const steps=[['question','真题与读题'],['ideas','观点推导'],['logic','主题段逻辑链'],['draft','英语表达'],['diagnosis','纠错与积累'],['network','知识网络']];
const starterQuestions=[{id:'starter-01',topic:'Education / Government',type:'Agree or disagree',text:'Some people believe that governments should spend more money on public transportation rather than building new roads. To what extent do you agree or disagree?',sourceNote:'训练用题目示例；真题出处未在本页面核验。'}];
let state=load();let step=0;
function load(){try{return JSON.parse(localStorage.getItem(STORE))||{questions:starterQuestions,activeQuestion:'starter-01',answers:{},phrases:[],errors:[],events:[],relations:[]}}catch(e){return{questions:starterQuestions,activeQuestion:'starter-01',answers:{},phrases:[],errors:[],events:[],relations:[]}}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));document.getElementById('savedStatus').textContent='已自动保存 · '+new Date().toLocaleTimeString()}
function q(){return state.questions.find(x=>x.id===state.activeQuestion)||state.questions[0]}
function a(){if(!state.answers[q().id])state.answers[q().id]={};return state.answers[q().id]}
function set(k,v){a()[k]=v;save()}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderNav(){document.getElementById('nav').innerHTML=steps.map((s,i)=>'<button class="'+(i===step?'active':'')+'" data-step="'+i+'">'+(i+1)+'. '+s[1]+'</button>').join('';document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;render()})}
function render(){renderNav();document.getElementById('progressBar').style.width=((step+1)/steps.length*100)+'%';let c=document.getElementById('content');const cur=q(),ans=a();c.innerHTML=step===0?questionView(cur,ans):step===1?ideasView(ans):step===2?logicView(ans):step===3?draftView(ans):step===4?diagnosisView(ans):networkView();wire();document.getElementById('nextStep')?.addEventListener('click',()=>{step=Math.min(steps.length-1,step+1);render()});document.getElementById('prevStep')?.addEventListener('click',()=>{step=Math.max(0,step-1);render()}}
function footer(){return '<div class="footer"><button class="btn ghost" id="prevStep">← 上一步</button><button class="btn primary" id="nextStep">下一步 →</button></div>'}
function questionView(cur,ans){return '<div class="eyebrow">STEP 01 · REAL IELTS QUESTION</div><h1>先读题，形成自己的思路</h1><p class="muted">题目是训练起点。先理解要求，不显示范文或预设观点。</p><div class="card"><div class="pill">'+escapeHtml(cur.type)+'</div><div class="pill">'+escapeHtml(cur.topic)+'</div><p class="question">'+escapeHtml(cur.text)+'</p><p class="small">'+escapeHtml(cur.sourceNote||'题目来源说明')+'</p></div><div class="field"><label>添加/切换题目（可粘贴你确认的真题）</label><textarea id="newQuestion" placeholder="粘贴题目原文"></textarea></div><button class="btn" id="addQuestion">加入题目并开始</button><h2>当前题目</h2><select id="questionSelect">'+state.questions.map(x=>'<option value="'+escapeHtml(x.id)+'">'+escapeHtml(x.text.slice(0,100))+'</option>').join('')+'</select>'+footer()}
function ideasView(ans){return '<div class="eyebrow">STEP 02 · IDEAS FIRST</div><h1>先用中文推导观点</h1><p class="muted">先写你自己的思路。暂时不追求英文，不提供现成论点。</p><div class="field"><label>立场 / Thesis</label><textarea id="thesis" placeholder="我赞成 / 反对 / 部分赞成，因为…">'+escapeHtml(ans.thesis||'')+'</textarea></div><div class="field"><label>分论点 1 / Body paragraph 1 idea</label><textarea id="idea1" placeholder="第一个主题段的核心观点…">'+escapeHtml(ans.idea1||'')+'</textarea></div><div class="field"><label>分论点 2 / Body paragraph 2 idea（可选）</label><textarea id="idea2" placeholder="另一个角度…">'+escapeHtml(ans.idea2||'')+'</textarea></div><div class="field"><label>你想到的例子或具体情境（可选）</label><textarea id="example" placeholder="具体场景、政策、个人或社会层面的例子…">'+escapeHtml(ans.example||'')+'</textarea></div>'+footer()}
function logicView(ans){return '<div class="eyebrow">STEP 03 · ARGUMENT CHAIN</div><h1>把观点推导成主题段</h1><p class="muted">从你写的观点开始。每一层都回答一个问题，不必强行填满五层。</p><div class="card"><strong>你的观点</strong><p>'+escapeHtml(ans.idea1||ans.thesis||'请先完成上一步观点')+'</p></div><div class="field"><label>① Reason — 为什么这个观点成立？</label><textarea id="reason" placeholder="因为…">'+escapeHtml(ans.reason||'')+'</textarea></div><div class="field"><label>② Mechanism — 具体通过什么方式发生？</label><textarea id="mechanism" placeholder="具体机制是…">'+escapeHtml(ans.mechanism||'')+'</textarea></div><div class="field"><label>③ Immediate result — 直接带来什么变化？</label><textarea id="result" placeholder="因此…">'+escapeHtml(ans.result||'')+'</textarea></div><div class="field"><label>④ Broader impact — 长期/更广泛的影响（可选）</label><textarea id="impact" placeholder="进一步…">'+escapeHtml(ans.impact||'')+'</textarea></div><div class="notice">逻辑链不追求字数。重点检查：观点相关性、因果关系、机制是否具体、结果是否自然。</div>'+footer()}
function draftView(ans){return '<div class="eyebrow">STEP 04 · TRY ENGLISH</div><h1>尝试用英语表达你的主题段</h1><p class="muted">写出你现在能写的版本。错误和表达缺口是系统需要收集的数据，不是失败。</p><div class="card"><strong>中文逻辑回顾</strong><p>'+escapeHtml([ans.idea1,ans.reason,ans.mechanism,ans.result,ans.impact].filter(Boolean).join(' → '))+'</p></div><div class="field"><label>你的英文主题段草稿</label><textarea id="draft" style="min-height:180px" placeholder="Try to write 3–5 connected sentences in English…">'+escapeHtml(ans.draft||'')+'</textarea></div><div class="notice">提示：如果有不会写的中文词组，可以直接在英文草稿中标注中文，或在下方“纠错与积累”逐条记录。</div>'+footer()}
function diagnosisView(ans){return '<div class="eyebrow">STEP 05 · LANGUAGE GAPS</div><h1>纠错，并记录真正需要积累的表达</h1><p class="muted">目前页面不连接AI自动批改。你可以粘贴AI或老师给出的修正，或者手动记录问题；记录会保存并关联当前题目。</p><div class="card"><div class="field"><label>你的原表达</label><input id="originalPhrase" placeholder="如：reduce the economic difficult"></div><div class="field"><label>修正后的自然表达</label><input id="correctPhrase" placeholder="如：reduce financial pressure"></div><div class="field"><label>中文含义 / Meaning</label><input id="phraseMeaning" placeholder="降低经济压力"></div><div class="grid2"><div class="field"><label>主题标签</label><input id="phraseTopic" placeholder="Education, Employment…"></div><div class="field"><label>表达功能</label><input id="phraseFunction" placeholder="Cause / Result / Impact…"></div></div><div class="field"><label>语境 / 自己的例句</label><textarea id="phraseContext" placeholder="写出这个词组如何在当前主题段中使用…"></textarea></div><div class="field"><label>错误类型（可选）</label><select id="errorType"><option value="不会表达">不会表达</option><option value="词汇/词性错误">词汇/词性错误</option><option value="搭配错误">搭配错误</option><option value="语法错误">语法错误</option><option value="表达不自然">表达不自然</option><option value="表达升级">表达升级</option></select><button class="btn primary" id="savePhrase">记录词组与错误</button></div><h2>本题已记录</h2><div id="thisQuestionPhraseList"></div>'+footer()}
function networkView(){let phrases=state.phrases,errs=state.errors;let topics={};phrases.forEach(p=>(p.topics||[]).forEach(t=>topics[t]=(topics[t]||0)+1));let topTopics=Object.entries(topics).sort((x,y)=>y[1]-x[1]);return '<div class="eyebrow">STEP 06 · PERSONAL KNOWLEDGE GRAPH</div><h1>你的个人知识网络</h1><p class="muted">从真实训练事件建立关联，不是预制的空词汇地图。</p><div class="statgrid"><div class="stat"><span class="small">独立词组</span><strong>'+phrases.length+'</strong></div><div class="stat"><span class="small">错误记录</span><strong>'+errs.length+'</strong></div><div class="stat"><span class="small">训练题目</span><strong>'+state.questions.length+'</strong></div></div><h2>主题节点</h2>'+topTopics.map(([t,n])=>'<span class="node">'+escapeHtml(t)+' · '+n+'</span>').join('')+'<h2>词组节点与关联</h2>'+ (phrases.length?phrases.map(p=>'<div class="card"><div class="phrase"><div><strong>'+escapeHtml(p.phrase)+'</strong><div class="muted">'+escapeHtml(p.meaning)+'</div><div class="tags">'+escapeHtml((p.topics||[]).join(' · '))+' / '+escapeHtml(p.function||'')+'</div><div class="small">来自题目：'+escapeHtml(p.questionText||'')+'</div><p>'+escapeHtml(p.context||'')+'</p></div><button class="btn ghost" data-delete-phrase="'+p.id+'">删除记录</button></div>').join(''):'<div class="card muted">尚无词组节点。完成一轮表达诊断后，这里会出现你自己的积累。</div>')+'<h2>错误趋势 / Error history</h2>'+ (errs.length?errs.map(e=>'<div class="card"><span class="danger">'+escapeHtml(e.original)+'</span> → <strong>'+escapeHtml(e.corrected)+'</strong><div class="small">'+escapeHtml(e.type)+' · '+escapeHtml(e.date)+'</div></div>').join(''):'<div class="muted">暂无错误记录</div>')+'<div class="btns"><button class="btn" id="exportGraph">导出知识网络 JSON</button><button class="btn" id="clearAll">清空本地数据</button></div>'}
function wire(){['thesis','idea1','idea2','example','reason','mechanism','result','impact','draft'].forEach(id=>{let el=document.getElementById(id);if(el)el.oninput=()=>set(id,el.value)});document.getElementById('questionSelect')?.addEventListener('change',e=>{state.activeQuestion=e.target.value;save();render()});document.getElementById('addQuestion')?.addEventListener('click',()=>{let txt=document.getElementById('newQuestion').value.trim();if(!txt)return alert('请先粘贴题目原文');let id='q-'+Date.now();state.questions.push({id,topic:'Topic pending',type:'Question type pending',text:txt,sourceNote:'用户添加题目；请自行核对来源'});state.activeQuestion=id;step=1;save();render()});document.getElementById('savePhrase')?.addEventListener('click',()=>{let original=document.getElementById('originalPhrase').value.trim(),corrected=document.getElementById('correctPhrase').value.trim(),meaning=document.getElementById('phraseMeaning').value.trim();if(!corrected)return alert('请至少填写修正后的表达');let topic=document.getElementById('phraseTopic').value.trim(),func=document.getElementById('phraseFunction').value.trim(),context=document.getElementById('phraseContext').value.trim(),type=document.getElementById('errorType').value;let found=state.phrases.find(p=>p.phrase.toLowerCase()===corrected.toLowerCase());if(found){found.occurrences=(found.occurrences||0)+1;found.contexts.push(context);found.topics=[...new Set([...(found.topics||[]),...(topic?topic.split(',').map(x=>x.trim()):[])])];found.functions=[...new Set([...(found.functions||[]),func].filter(Boolean))];}else state.phrases.push({id:'p-'+Date.now(),phrase:corrected,meaning,topics:topic?topic.split(',').map(x=>x.trim()):[],function:func,functions:func?[func]:[],context,contexts:[context],questionId:q().id,questionText:q().text,occurrences:1,createdAt:new Date().toISOString(),recall:0,applications:0});if(original){state.errors.push({id:'e-'+Date.now(),original,corrected,type,date:new Date().toLocaleDateString(),questionId:q().id,questionText:q().text});}save();render();alert('已记录：词组节点已保存，错误记录已关联当前题目。')});document.getElementById('exportGraph')?.addEventListener('click',()=>downloadJSON(state,'ielts-personal-knowledge-graph.json'));document.getElementById('exportBtn').onclick=()=>downloadJSON(state,'ielts-paragraph-lab-backup.json');document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!data.questions||!data.phrases)throw Error('format');state=data;save();render();alert('备份导入成功')}catch(err){alert('导入失败：文件格式不正确')}};reader.readAsText(f)};document.querySelectorAll('[data-delete-phrase]').forEach(b=>b.onclick=()=>{if(confirm('删除这条词组记录？')){state.phrases=state.phrases.filter(p=>p.id!==b.dataset.deletePhrase);save();render()}});document.getElementById('clearAll')?.addEventListener('click',()=>{if(confirm('确定清空所有本地训练数据？此操作无法撤销。')){state={questions:starterQuestions,activeQuestion:'starter-01',answers:{},phrases:[],errors:[],events:[],relations:[]};save();render()}})}
function downloadJSON(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
render();
</script></body></html>
